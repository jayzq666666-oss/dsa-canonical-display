name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  synthetic-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python examples/make_synthetic.py --output demo
      - run: dsa-display batch --raw-index demo/raw-index.csv --effective-index demo/effective.csv --source-root demo/source --derived-root demo/derived --audit-csv demo/audit.csv --summary-json demo/summary.json --workers 2
